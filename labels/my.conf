[labels]
app.name = စကားလုံးများ

notifications.topic.activity = ဂိမ်း လှုပ်ရှားမှု
notifications.topic.message = မက်ဆေ့ဂျ်များ

# Error messages used by a.error.label(...). Generated keys mirror
# the previous hardcoded a.error() literals.
errors.unknown_asset = ပိုင်ဆိုင်မှု မသိ
errors.invalid_game_id = ဂိမ်း ID မမှန်ကန်ပါ
errors.game_not_found = ဂိမ်း မတွေ့ပါ
errors.not_a_player = ဤ ဂိမ်း တွင် ကစားသမား မဟုတ်ပါ
errors.invalid_language = ဘာသာစကား မမှန်ကန်ပါ
errors.at_least_one_opponent_required = ပြိုင်ဘက် အနည်းဆုံး တစ်ဦး လိုအပ်သည်
errors.1_3_opponents_required = ပြိုင်ဘက် ၁-၃ ဦး လိုအပ်သည်
errors.cannot_play_against_yourself = မိမိနှင့်မိမိ ကစား၍မရပါ
errors.duplicate_opponent = ပြိုင်ဘက် ထပ်နေပါသည်
errors.can_only_play_with_friends = မိတ်ဆွေများနှင့်သာ ကစားနိုင်သည်
errors.invalid_message = မက်ဆေ့ဂျ် မမှန်ကန်ပါ
errors.invalid_words = စကားလုံးများ မမှန်ကန်ပါ
errors.message_too_long = မက်ဆေ့ဂျ် ရှည်လွန်းသည်
errors.message_cannot_be_empty = မက်ဆေ့ဂျ် သည် ဗလာ မဖြစ်ရပါ
errors.game_is_not_active = ဂိမ်း သည် လှုပ်ရှားနေခြင်း မရှိပါ
errors.not_your_turn = သင့်အလှည့် မဟုတ်သေးပါ
errors.game_state_changed = ဂိမ်းအခြေအနေ ပြောင်းလဲသွားပါပြီ
errors.invalid_tile_character = ကြွေပြား စာလုံး မမှန်ကန်ပါ
errors.invalid_board_state = ဘုတ် အခြေအနေ မမှန်ကန်ပါ
errors.invalid_score = ရမှတ် မမှန်ကန်ပါ
errors.invalid_tiles_to_exchange = လဲလှယ်ရန် ကြွေပြားများ မမှန်ကန်ပါ
errors.not_enough_tiles_in_bag_to_exchange = လဲလှယ်ရန် အိတ်ထဲတွင် ကြွေပြားများ မလုံလောက်ပါ
errors.cannot_delete_an_active_game = လှုပ်ရှားနေသော ဂိမ်း ကို ဖျက်၍မရပါ
errors.word_is_required = စကားလုံး လိုအပ်သည်
errors.invalid_opponent = ပြိုင်ဘက် မမှန်ကန်ပါ - {opponent}
errors.tile_not_in_rack = ကြွေပြားစင် ထဲတွင် ကြွေပြား မရှိပါ - {tile}
errors.asset_not_set = {asset} သတ်မှတ်ထားခြင်း မရှိပါ
errors.asset_unavailable = {asset} မရရှိနိုင်ပါ

# Notification titles and bodies. Recipient-side composition; resolved
# against the recipient's language at notify() time.
notifications.title.game = စကားလုံးများ ဂိမ်း
notifications.title.move = စကားလုံးများ ရွှေ့ကွက်
notifications.title.message = စကားလုံးများ စာ
notifications.title.words = စကားလုံးများ
notifications.body.message = {author}: {excerpt}
notifications.body.opponent_resigned = ပြိုင်ဘက် လက်လျှော့လိုက်သည်
notifications.body.started_game = {name} သည် ဂိမ်း တစ်ခု စတင်လိုက်သည်
notifications.body.played_move = {name} သည် {move} ကစားလိုက်သည်
notifications.body.passed = {name} ပယ်လိုက်သည်
notifications.body.exchanged_tiles = {name} သည် ကြွေပြားများ လဲလှယ်လိုက်သည်
