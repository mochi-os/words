notifications.topic.activity = Actividad del juego
errors.invalid_game_id = ID de juego no válido
errors.game_not_found = Juego no encontrado
errors.not_a_player = No es jugador en este juego
errors.cannot_play_against_yourself = No se puede jugar contra usted mismo
errors.game_is_not_active = El juego no está activo
